[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsme-parser"
version = "0.3.0"
description = "FastAPI demo for structure-first FAQ and schedule parsing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.6",
]

[project.scripts]
gsme-parser = "gsme_parser.cli:main"
gsme-api = "gsme_parser.api.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]