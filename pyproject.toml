[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsme-rag"
version = "0.15.4"
description = "Inspectable GSME RAG parsing, reviewed storage and evidence retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0,<2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
pdf = ["docling>=2.50,<3", "httpx[socks]>=0.27"]
test = ["httpx2>=0.1.0"]
storage = ["psycopg[binary]>=3.2,<4", "qdrant-client>=1.20,<1.21", "cohere>=5.20,<6", "tiktoken>=0.9,<1", "python-dotenv>=1,<2", "httpx[socks]>=0.27"]

[project.scripts]
gsme-rag = "gsme_rag.cli:main"
gsme-rag-api = "gsme_rag.api.run:main"
gsme-rag-storage = "gsme_rag.storage.cli:main"
gsme-rag-admin = "gsme_rag.storage.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
