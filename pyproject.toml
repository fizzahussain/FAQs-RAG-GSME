[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsme-rag"
version = "0.9.1"
description = "Inspectable parsing and chunking lab for the GSME RAG pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.6",
]

[project.scripts]
gsme-rag = "gsme_rag.cli:main"
gsme-rag-api = "gsme_rag.api.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
